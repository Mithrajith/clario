version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: clario-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clario_db}
      POSTGRES_USER: ${POSTGRES_USER:-clario_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clario_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-clario_user} -d $${POSTGRES_DB:-clario_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clario-network

  qdrant:
    image: qdrant/qdrant:v1.10.0
    container_name: clario-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clario-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clario-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-clario_user}:${POSTGRES_PASSWORD:-clario_password}@postgres:5432/${POSTGRES_DB:-clario_db}
      - QDRANT_URL=http://qdrant:6333
      - ENVIRONMENT=production
      - DEBUG=False
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - clario-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clario-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - clario-network

volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  backend_storage:
    driver: local

networks:
  clario-network:
    driver: bridge
